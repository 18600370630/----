<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ecf0ed">
  <meta name="description" content="风有信，雪有期。轻触信封，收下一封温柔的立冬来信。兼容手机与桌面。">
  <title>冬日来信 · 立冬快乐</title>
  <style>
    :root {
      --ink: #4a5d59;
      --muted: #7b8c86;
      --gold: #b49562;
      --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      --ease: cubic-bezier(.22, 1, .36, 1)
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      width: 100%
    }

    body {
      background: #e5ecea;
      color: var(--ink);
      font-family: var(--sans);
      -webkit-tap-highlight-color: transparent
    }

    button {
      font: inherit;
      color: inherit
    }

    button:focus-visible {
      outline: 2px solid #927b50;
      outline-offset: 8px
    }

    button {
      touch-action: manipulation
    }

    ::selection {
      background: #d5d9c9
    }

    .world {
      position: relative;
      isolation: isolate;
      min-height: 800px;
      min-height: max(800px, 100svh);
      overflow: hidden;
      background: radial-gradient(ellipse at 75% 17%, #fbf2e2aa 0, transparent 29%), linear-gradient(#edf0eb, #e2eceb 70%, #f3f3ed)
    }

    .landscape,
    .snow,
    .grain {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    .landscape {
      z-index: -3
    }

    .landscape svg {
      width: 100%;
      height: 100%;
      display: block
    }

    .grain {
      z-index: 7;
      opacity: .038;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23000' filter='url(%23n)' opacity='.65' d='M0 0h180v180H0z'/%3E%3C/svg%3E")
    }

    .snow {
      z-index: 6
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 38%, #f4f5ec33 15%, transparent 60%)
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 32px 4.4vw;
      position: relative;
      z-index: 8;
      gap: 16px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px
    }

    .brand svg {
      width: 26px;
      height: 26px;
      color: #8e9d90
    }

    .brand-name {
      font-family: var(--serif);
      font-size: 19px;
      letter-spacing: 5px
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 25px
    }

    .season-meta {
      font-size: 10px;
      letter-spacing: 2.7px;
      color: #7d8e86
    }

    .snow-toggle {
      width: 39px;
      height: 39px;
      border: 1px solid #8c9c7b38;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff5;
      cursor: pointer;
      transition: background .25s, transform .25s
    }

    .snow-toggle:hover {
      background: #fff9;
      transform: rotate(15deg)
    }

    .snow-toggle svg {
      width: 18px;
      height: 18px
    }

    .snow-toggle[aria-pressed="false"] {
      opacity: .55
    }

    main {
      position: relative;
      width: min(1160px, 100%);
      margin: auto;
      padding: 30px 22px 0;
      text-align: center;
      z-index: 2
    }

    .intro {
      animation: arrive 1.2s var(--ease) both;
      transition: opacity .8s, transform .8s
    }

    .eyebrow {
      margin: 0 0 20px;
      font-size: 10px;
      letter-spacing: 5.5px;
      color: #8a9586;
      font-weight: 400
    }

    .intro h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(36px, 4.2vw, 58px);
      line-height: 1.42;
      letter-spacing: 8px;
      margin: 0 0 17px;
      color: #475d56
    }

    .intro h1 em {
      font-style: normal;
      color: #8a9379
    }

    .subtitle {
      font-family: var(--serif);
      font-size: 14px;
      letter-spacing: 2px;
      line-height: 2;
      margin: 0;
      color: #7a8c83
    }

    .subtitle .second {
      display: inline
    }

    .letter-stage {
      position: relative;
      width: 500px;
      height: 353px;
      margin: 36px auto 0;
      perspective: 1200px;
      isolation: isolate;
      animation: arrive 1.3s .25s var(--ease) both
    }

    .envelope {
      position: absolute;
      width: 360px;
      height: 234px;
      left: 70px;
      top: 48px;
      transform: rotate(-5deg);
      filter: drop-shadow(0 24px 22px #4c655b26);
      transition: transform 1s var(--ease), opacity 1s;
      animation: float 5s 1.6s ease-in-out infinite;
      perspective: 1200px
    }

    .envelope::after {
      content: "";
      position: absolute;
      z-index: -1;
      left: 15%;
      right: 5%;
      height: 20px;
      bottom: -38px;
      background: #58766618;
      filter: blur(15px);
      border-radius: 50%;
      transform: rotate(5deg)
    }

    .env-back {
      position: absolute;
      inset: 0;
      border-radius: 7px;
      background: #d7c7a9;
      border: 1px solid #bba88555;
      box-shadow: inset 0 0 30px #7c6a4630
    }

    .env-front {
      position: absolute;
      inset: 0;
      z-index: 4;
      overflow: hidden;
      border-radius: 6px;
      background: linear-gradient(26deg, #e9dfc9 0%, #f5eddb 45%, #f8f0de 100%);
      clip-path: polygon(0 0, 50% 51%, 100% 0, 100% 100%, 0 100%)
    }

    .env-front::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(33deg, transparent 49.55%, #b6a48250 49.75%, #fff9 50%, transparent 50.3%) left/50% 100% no-repeat, linear-gradient(-33deg, transparent 49.55%, #b6a48250 49.75%, #fff9 50%, transparent 50.3%) right/50% 100% no-repeat
    }

    .env-front::after {
      content: "";
      position: absolute;
      inset: 11px;
      border: 1px solid #bb9d665c;
      border-radius: 2px;
      clip-path: polygon(0 40%, 50% 70%, 100% 40%, 100% 100%, 0 100%)
    }

    .flap {
      position: absolute;
      z-index: 5;
      inset: 0 0 auto;
      height: 140px;
      transform-origin: center top;
      backface-visibility: hidden;
      filter: drop-shadow(0 2px 1px #8370511c)
    }

    .flap svg {
      width: 100%;
      height: 100%;
      overflow: visible
    }

    .flap-back {
      position: absolute;
      inset: 0 0 auto;
      height: 140px;
      background: linear-gradient(#ded1b7, #f4e9d3);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top;
      transform: rotateX(0);
      z-index: 1
    }

    .seal {
      position: absolute;
      z-index: 6;
      width: 62px;
      height: 62px;
      border-radius: 48% 51% 47% 50%;
      background: radial-gradient(circle at 35% 30%, #cdae79 0, #b28b50 55%, #9c773d 100%);
      box-shadow: 0 4px 6px #7054312b, inset 0 0 0 2px #d7b983aa, inset 0 0 0 5px #ae854b88;
      left: 149px;
      top: 100px;
      display: grid;
      place-items: center;
      transition: opacity .4s, transform .5s
    }

    .seal::after {
      content: "";
      position: absolute;
      inset: 9px;
      border: 1px solid #ebcfa599;
      border-radius: 50%;
      box-shadow: 0 1px 0 #7c582966
    }

    .seal svg {
      width: 32px;
      height: 32px;
      color: #f1ddba;
      filter: drop-shadow(0 1px 0 #805b3e)
    }

    .recipient {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 29px;
      z-index: 5;
      font-size: 11px;
      letter-spacing: 4px;
      color: #99825e;
      font-family: var(--serif)
    }

    .env-botanical {
      position: absolute;
      z-index: 5;
      left: 10px;
      bottom: 6px;
      width: 110px;
      height: 98px;
      opacity: .5;
      pointer-events: none
    }

    .env-botanical.right {
      left: auto;
      right: 4px;
      transform: scaleX(-1);
      width: 80px;
      opacity: .3
    }

    .envelope-hit {
      position: absolute;
      inset: -12px;
      z-index: 10;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 15px
    }

    .envelope-hit:focus-visible {
      outline-offset: 10px
    }

    .envelope:hover {
      filter: drop-shadow(0 28px 25px #4c655b35)
    }

    .letter {
      position: absolute;
      left: 80px;
      top: -33px;
      width: 340px;
      min-height: 370px;
      z-index: 2;
      opacity: 0;
      background: linear-gradient(130deg, #fffdf6, #f6f2e7);
      border: 1px solid #d3c4a180;
      box-shadow: 0 10px 38px #4f645526, inset 0 0 40px #d9cba315;
      padding: 27px 25px 25px;
      transform: translateY(100px) scale(.8);
      pointer-events: none;
      text-align: center;
      border-radius: 3px
    }

    .letter::before {
      content: "";
      position: absolute;
      inset: 11px;
      border: 1px solid #c0a66a55;
      pointer-events: none
    }

    .letter::after {
      content: "";
      position: absolute;
      inset: 16px;
      border: 1px solid #d2c3a22e;
      pointer-events: none
    }

    .letter-top {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      color: #a3906a;
      font-size: 9px;
      letter-spacing: 3px;
      margin: 0 0 17px
    }

    .letter-top::before,
    .letter-top::after {
      content: "";
      width: 27px;
      height: 1px;
      background: #d1c2a2
    }

    .letter-sprig {
      width: 64px;
      height: 49px;
      color: #a2ac92;
      display: block;
      margin: 0 auto 8px
    }

    .dear {
      font-family: var(--serif);
      font-size: 12px;
      letter-spacing: 2px;
      text-align: left;
      color: #9a977f;
      margin: 5px 12px 12px
    }

    .letter h2 {
      font-family: var(--serif);
      font-size: 40px;
      font-weight: 400;
      letter-spacing: 7px;
      margin: 0 0 17px;
      color: #55694e;
      line-height: 1.5
    }

    .letter-lines {
      font-family: var(--serif);
      font-size: 14px;
      line-height: 2.15;
      letter-spacing: 1.8px;
      color: #7c8776;
      margin: 0
    }

    .letter-rule {
      width: 28px;
      height: 1px;
      background: #b8a27666;
      margin: 17px auto 14px
    }

    .signoff {
      font-family: var(--serif);
      color: #a18f6b;
      font-size: 12px;
      letter-spacing: 2px;
      margin: 0
    }

    .letter-stamp {
      position: absolute;
      right: 25px;
      bottom: 22px;
      writing-mode: vertical-rl;
      border: 1px solid #b77f625a;
      border-radius: 3px;
      padding: 5px 3px;
      color: #b58d74;
      font: 10px var(--serif);
      letter-spacing: 2px;
      transform: rotate(5deg);
      opacity: .8
    }

    .stage-hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10px;
      color: #829181;
      font-size: 12px;
      letter-spacing: 2.4px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 11px;
      transition: opacity .3s, transform .3s
    }

    .stage-hint svg {
      width: 17px;
      height: 17px;
      color: #ab9c79;
      animation: tap 2.5s ease-in-out infinite
    }

    .stage-hint::before,
    .stage-hint::after {
      content: "";
      height: 1px;
      width: 25px;
      background: #a9b2a054
    }

    .sparkle {
      position: absolute;
      color: #b3a47b;
      opacity: .65;
      animation: twinkle 3s ease-in-out infinite;
      pointer-events: none
    }

    .sparkle.a {
      left: 46px;
      top: 79px;
      font-size: 20px
    }

    .sparkle.b {
      right: 30px;
      top: 190px;
      font-size: 14px;
      animation-delay: 1s
    }

    .sparkle.c {
      right: 87px;
      top: 5px;
      font-size: 10px;
      animation-delay: 2s
    }

    .side-note {
      position: absolute;
      top: 255px;
      font-family: var(--serif);
      font-size: 12px;
      letter-spacing: 6px;
      line-height: 2.2;
      writing-mode: vertical-rl;
      color: #8c9d8f9c
    }

    .side-note.left {
      left: 15%
    }

    .side-note.right {
      right: 15%;
      top: 310px
    }

    .side-note::after {
      content: "";
      display: block;
      width: 1px;
      height: 38px;
      background: #b1bca69c;
      margin: 16px 10px
    }

    .season-tag {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      border: 1px solid #a4b09655;
      background: #fbfcf51f;
      padding: 10px 22px;
      border-radius: 40px;
      font-family: var(--serif);
      font-size: 11px;
      letter-spacing: 3px;
      color: #7e8e79;
      margin-top: 1px
    }

    .season-tag svg {
      width: 14px;
      height: 14px;
      color: #9ca884
    }

    .replay {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: max-content;
      margin: 0 auto;
      padding: 10px 18px;
      border: 1px solid #a7b49c88;
      background: #f5f7ee77;
      border-radius: 30px;
      font-size: 12px;
      letter-spacing: 2px;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity .6s, transform .6s;
      position: absolute;
      bottom: -11px;
      left: 50%;
      translate: -50% 0;
      white-space: nowrap
    }

    .replay svg {
      width: 14px;
      height: 14px
    }

    .replay:hover {
      background: #fff9
    }

    .footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 42px 20px 29px;
      font-family: var(--serif);
      font-size: 11px;
      letter-spacing: 3px;
      color: #9aa794
    }

    .footer .tiny {
      display: block;
      font-family: var(--sans);
      font-size: 8px;
      letter-spacing: 3.5px;
      margin-top: 12px;
      color: #a4b0a1
    }

    .season-mark {
      position: absolute;
      bottom: 34px;
      left: 4.4vw;
      display: flex;
      align-items: center;
      gap: 11px;
      color: #92a28f
    }

    .season-mark .cn {
      font: 28px var(--serif);
      letter-spacing: 3px
    }

    .season-mark .en {
      font-size: 7px;
      letter-spacing: 2px;
      line-height: 1.9
    }

    .corner-coordinate {
      position: absolute;
      right: 4.4vw;
      bottom: 39px;
      font-size: 8px;
      letter-spacing: 2px;
      color: #99a693
    }

    .toast {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translate(-50%, 10px);
      border: 1px solid #c7cbb4;
      background: #f7f8efee;
      color: #7a856e;
      padding: 11px 19px;
      border-radius: 30px;
      font-size: 12px;
      letter-spacing: 1px;
      opacity: 0;
      transition: .3s;
      z-index: 20;
      pointer-events: none;
      white-space: nowrap
    }

    .toast.visible {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    body.is-open .envelope {
      animation: none;
      transform: translateY(65px) rotate(3deg) scale(.92);
      opacity: .8
    }

    body.is-open .flap {
      animation: unfold .85s var(--ease) forwards
    }

    body.is-open .flap-back {
      animation: unfold-back .85s var(--ease) forwards
    }

    body.is-open .seal {
      opacity: 0;
      transform: translateY(5px) scale(.8)
    }

    body.is-open .envelope-hit {
      pointer-events: none
    }

    body.is-open .letter {
      animation: letter-flight 1.9s .5s var(--ease) forwards;
      pointer-events: auto
    }

    body.is-open .stage-hint {
      opacity: 0;
      transform: translateY(10px)
    }

    body.is-open .sparkle {
      opacity: 0
    }

    body.is-open .replay {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition-delay: 2.25s
    }

    body.is-open .intro {
      transform: translateY(-10px);
      opacity: .65
    }

    @keyframes arrive {
      from {
        opacity: 0;
        transform: translateY(18px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) rotate(-5deg)
      }

      50% {
        transform: translateY(-9px) rotate(-3.5deg)
      }
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: .18;
        transform: scale(.8)
      }

      50% {
        opacity: .7;
        transform: scale(1.12)
      }
    }

    @keyframes tap {

      0%,
      70%,
      100% {
        transform: translateY(0)
      }

      80% {
        transform: translateY(3px)
      }

      90% {
        transform: translateY(-1px)
      }
    }

    @keyframes unfold {
      0% {
        transform: rotateX(0deg);
        z-index: 5
      }

      49% {
        z-index: 5
      }

      50%,
      100% {
        z-index: 1
      }

      100% {
        transform: rotateX(180deg)
      }
    }

    @keyframes unfold-back {
      0% {
        transform: rotateX(0)
      }

      100% {
        transform: rotateX(180deg)
      }
    }

    @keyframes letter-flight {
      0% {
        opacity: 0;
        transform: translateY(110px) rotate(-4deg) scale(.78);
        z-index: 2
      }

      12% {
        opacity: 1
      }

      46% {
        transform: translateY(-125px) rotate(-5deg) scale(.9);
        z-index: 2
      }

      47% {
        z-index: 8
      }

      75% {
        transform: translateY(-44px) rotate(1.5deg) scale(1.02);
        z-index: 8
      }

      100% {
        opacity: 1;
        transform: translateY(-21px) rotate(-1.5deg) scale(1);
        z-index: 8
      }
    }

    @media(min-width:1600px) {
      main {
        padding-top: 55px
      }

      .letter-stage {
        margin-top: 55px
      }

      .footer {
        padding-top: 55px
      }

      .world {
        min-height: max(900px, 100svh)
      }
    }

    @media(max-width:700px) {
      .world {
        min-height: 100svh
      }

      .topbar {
        padding: calc(20px + env(safe-area-inset-top)) 24px 18px
      }

      .brand-name {
        font-size: 16px;
        letter-spacing: 4px
      }

      .brand svg {
        width: 23px;
        height: 23px
      }

      .top-right {
        gap: 0
      }

      .season-meta {
        display: none
      }

      .snow-toggle {
        width: 35px;
        height: 35px
      }

      main {
        padding: 36px 16px 0
      }

      .eyebrow {
        font-size: 8px;
        letter-spacing: 3.6px;
        margin-bottom: 19px
      }

      .intro h1 {
        font-size: 36px;
        letter-spacing: 4px;
        margin-bottom: 16px;
        white-space: nowrap
      }

      .subtitle {
        font-size: 12px;
        letter-spacing: 1.5px;
        line-height: 2.1
      }

      .subtitle .second {
        display: block
      }

      .letter-stage {
        width: 344px;
        height: 327px;
        margin-top: 29px;
        max-width: 100%
      }

      .envelope {
        width: 300px;
        height: 196px;
        left: 22px;
        top: 43px
      }

      .flap,
      .flap-back {
        height: 117px
      }

      .seal {
        width: 54px;
        height: 54px;
        left: 123px;
        top: 82px
      }

      .seal svg {
        width: 28px;
        height: 28px
      }

      .recipient {
        font-size: 10px;
        letter-spacing: 3px;
        bottom: 23px
      }

      .env-botanical {
        width: 91px;
        height: 82px
      }

      .env-botanical.right {
        width: 67px
      }

      .letter {
        width: 290px;
        min-height: 338px;
        left: 27px;
        top: -34px;
        padding: 23px 20px
      }

      .letter h2 {
        font-size: 34px;
        letter-spacing: 6px;
        margin-bottom: 12px
      }

      .letter-top {
        font-size: 8px;
        margin-bottom: 11px
      }

      .letter-sprig {
        height: 42px
      }

      .dear {
        font-size: 11px;
        margin-bottom: 8px
      }

      .letter-lines {
        font-size: 13px;
        line-height: 2.15;
        letter-spacing: 1.4px
      }

      .letter-rule {
        margin: 15px auto 12px
      }

      .signoff {
        font-size: 11px
      }

      function newFlake(initial = false) { return { x: Math.random() * width, y: initial ? Math.random() * height : -20, r: .7 + Math.random() * 2.5, speed: 13 + Math.random() * 28, drift: Math.random() * 13 - 6.5, phase: Math.random() * Math.PI * 2, alpha: .24 + Math.random() * .58, crystal: Math.random() > .91 } }
      function resize() { const world = document.querySelector('.world'); width = world.clientWidth; height = world.clientHeight; const dpr = Math.min(devicePixelRatio || 1, 2); canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr); canvas.style.width = width + 'px'; canvas.style.height = height + 'px'; ctx?.setTransform(dpr, 0, 0, dpr, 0, 0); flakes = Array.from({ length: reduced.matches ? 28 : (width < 700 ? 42 : 82) }, () => newFlake(true)); drawStatic() }
      function drawFlake(f, time) { if (!ctx) return; const x = f.x + Math.sin(time * .0005 + f.phase) * 13; ctx.globalAlpha = f.alpha; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x, f.y, f.r, 0, Math.PI * 2); ctx.fill(); if (f.crystal) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = .6; ctx.beginPath(); for (let j = 0; j < 3; j++) { const a = j * Math.PI / 3, dx = Math.cos(a) * f.r * 2.8, dy = Math.sin(a) * f.r * 2.8; ctx.moveTo(x - dx, f.y - dy); ctx.lineTo(x + dx, f.y + dy) } ctx.stroke() } }
      function drawStatic() { if (!ctx) return; ctx.clearRect(0, 0, width, height); flakes.forEach(f => drawFlake(f, 0)); ctx.globalAlpha = 1 }
      function tick(time) { if (!enabled || document.hidden || !ctx) { raf = 0; return } const dt = Math.min((time - lastTime) / 1000 || .016, .05); lastTime = time; ctx.clearRect(0, 0, width, height); for (let i = 0; i < flakes.length; i++) { const f = flakes[i]; f.y += f.speed * dt; f.x += f.drift * dt; if (f.y > height + 20) flakes[i] = newFlake(); else { if (f.x < -30) f.x = width + 20; if (f.x > width + 30) f.x = -20; drawFlake(f, time) } } ctx.globalAlpha = 1; raf = requestAnimationFrame(tick) }
      function run() { if (enabled && !document.hidden && !raf && ctx) { lastTime = performance.now(); raf = requestAnimationFrame(tick) } }
      function updateToggle() { snowToggle.setAttribute('aria-pressed', String(enabled)); snowToggle.setAttribute('aria-label', enabled ? '暂停飘雪' : '开启飘雪'); snowToggle.title = enabled ? '暂停飘雪' : '开启飘雪' }
      snowToggle.addEventListener('click', () => { enabled = !enabled; updateToggle(); if (enabled) run(); else { cancelAnimationFrame(raf); raf = 0 } const toast = document.getElementById('toast'); clearTimeout(toastTimer); toast.textContent = enabled ? '雪花又轻轻飘落了' : '让这一刻，静静停留'; toast.classList.add('visible'); toastTimer = setTimeout(() => toast.classList.remove('visible'), 1800) });
      function burst() { if (!enabled) return; for (let i = 0; i < 17; i++) { const f = newFlake(); f.x = width / 2 + (Math.random() - .5) * 300; f.y = Math.min(height * .5, 400) + (Math.random() - .5) * 200; f.alpha = .7; flakes.push(f) } setTimeout(() => { if (flakes.length > 82) flakes.splice(0, flakes.length - (width < 700 ? 42 : 82)) }, 5000) }
      document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0 } else run() });
      let resizeFrame = 0; window.addEventListener('resize', () => { cancelAnimationFrame(resizeFrame); resizeFrame = requestAnimationFrame(resize) });
      reduced.addEventListener?.('change', resize);
      resize(); updateToggle(); run();
    })();
  </script>
